[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decayguard-alpha-mining"
version = "0.1.0"
description = "LLM-assisted formulaic alpha mining with out-of-sample decay control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
